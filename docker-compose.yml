name: bluecollaragents

services:
  postgres:
    image: postgres:16-alpine
    container_name: bluecollaragents-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bluecollar
      POSTGRES_PASSWORD: bluecollar_dev
      POSTGRES_DB: bluecollaragents
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5437:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluecollar -d bluecollaragents"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
    name: bluecollaragents-postgres-data
